<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی‌کده — فروشگاه دیجیتال بازی</title>
<meta name="description" content="فروشگاه دیجیتال بازی: گیفت کارت، پوینت بازی و اشتراک‌های پرمیوم. [توضیح خدمات و شرایط]">
<style>
@font-face{font-family:'YekanBakh';font-weight:300;font-display:swap;src:url('assets/fonts/YekanBakh-Light.woff2') format('woff2')}
@font-face{font-family:'YekanBakh';font-weight:400;font-display:swap;src:url('assets/fonts/YekanBakh-Regular.woff2') format('woff2')}
@font-face{font-family:'YekanBakh';font-weight:600;font-display:swap;src:url('assets/fonts/YekanBakh-SemiBold.woff2') format('woff2')}
@font-face{font-family:'YekanBakh';font-weight:700;font-display:swap;src:url('assets/fonts/YekanBakh-Bold.woff2') format('woff2')}

:root{
  --bg:#0b0d1a;
  --bg2:#12142a;
  --card:#171a33;
  --line:#262a4d;
  --ink:#f2f3ff;
  --mute:#9aa0c7;
  --acc:#7c5cff;
  --acc2:#22d3ee;
  --ok:#34d399;
  --warn:#fbbf24;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'YekanBakh',Tahoma,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(124,92,255,.22),transparent 60%),
                   radial-gradient(700px 400px at 0% 10%,rgba(34,211,238,.12),transparent 60%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
.wrap{width:min(1180px,calc(100% - 32px));margin-inline:auto}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,13,26,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.logo__mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-weight:700}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nav a{padding:6px 12px;border-radius:10px;color:var(--mute);font-size:.92rem;transition:.2s}
.nav a:hover,.nav a.is-on{color:var(--ink);background:rgba(124,92,255,.14)}
.cart-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem}
.cart-btn b{background:var(--acc2);color:#04121a;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.75rem;padding:0 6px}

/* hero */
.hero{padding:64px 0 36px;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(1.9rem,4vw,3rem);line-height:1.35;font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin-top:14px;max-width:560px}
.hero__btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.2s;font-size:.95rem}
.btn:hover{transform:translateY(-1px)}
.btn--main{background:linear-gradient(135deg,var(--acc),#5b3df0);border-color:transparent;color:#fff;box-shadow:0 10px 30px -10px rgba(124,92,255,.7)}
.btn--ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.badge{font-size:.8rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:rgba(23,26,51,.6)}
.badge--ok{color:var(--ok);border-color:rgba(52,211,153,.35)}
.hero__panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.hero__panel h3{font-size:1rem;margin-bottom:12px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);color:var(--mute);font-size:.92rem}
.step:last-child{border-bottom:0}
.step i{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(124,92,255,.2);color:#c9bdff;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:700}

/* sections */
.sec{padding:34px 0}
.sec__head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec__head h2{font-size:1.35rem}
.sec__head p{color:var(--mute);font-size:.92rem}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;transition:.2s;display:flex;gap:14px;align-items:center}
.cat:hover{border-color:var(--acc);transform:translateY(-2px)}
.cat__ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(34,211,238,.12);color:var(--acc2);font-size:1.3rem;flex:none}
.cat h3{font-size:1rem}
.cat small{color:var(--mute);font-size:.8rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:rgba(124,92,255,.6);transform:translateY(-3px)}
.card__art{height:120px;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.18))}
.card__body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card__tag{font-size:.75rem;color:var(--acc2)}
.card h3{font-size:1rem;line-height:1.5}
.card__meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.price{font-weight:700;font-size:1rem}
.price small{color:var(--mute);font-weight:400;font-size:.78rem;margin-inline-start:4px}
.mini{padding:7px 12px;border-radius:10px;background:var(--acc);color:#fff;border:0;cursor:pointer;font-size:.85rem}
.mini:hover{filter:brightness(1.1)}

/* product page */
.crumbs{color:var(--mute);font-size:.85rem;margin:24px 0 12px}
.crumbs a{color:var(--acc2)}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;margin-top:10px}
.prod__art{height:300px;border-radius:var(--r);display:grid;place-items:center;font-size:5rem;background:linear-gradient(135deg,rgba(124,92,255,.4),rgba(34,211,238,.2));border:1px solid var(--line)}
.prod h1{font-size:1.6rem;line-height:1.5}
.prod__lede{color:var(--mute);margin:10px 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.box h3{font-size:1rem;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.opt{padding:12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--bg2);text-align:center;transition:.15s}
.opt.is-on{border-color:var(--acc);background:rgba(124,92,255,.16)}
.opt b{display:block;font-size:.95rem}
.opt small{color:var(--mute);font-size:.78rem}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);margin-top:6px}
.field:focus{outline:2px solid rgba(124,92,255,.5);border-color:transparent}
label{display:block;font-size:.88rem;color:var(--mute);margin-top:12px}
.steps-list{list-style:none;counter-reset:s}
.steps-list li{counter-increment:s;padding:8px 0 8px 0;color:var(--mute);font-size:.92rem;position:relative;padding-inline-start:34px}
.steps-list li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:24px;height:24px;border-radius:50%;background:rgba(34,211,238,.15);color:var(--acc2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq p{color:var(--mute);margin-top:8px;font-size:.92rem}
.note{font-size:.85rem;color:var(--warn);margin-top:10px}

/* cart drawer */
.drawer{position:fixed;inset:0;background:rgba(3,4,10,.6);display:none;z-index:80}
.drawer.is-open{display:block}
.drawer__panel{position:absolute;top:0;inset-inline-end:0;height:100%;width:min(400px,100%);background:var(--bg2);border-inline-start:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer__list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.line{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.line small{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:1rem}

/* toast */
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:99;font-size:.9rem}
.toast.is-on{opacity:1;transform:translateX(50%) translateY(0)}

footer{margin-top:50px;border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:36px}
  .prod{grid-template-columns:1fr}
  .nav{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr__in">
    <a class="logo" href="#/"><span class="logo__mark">ب</span><span>بازی‌کده</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">خانه</a>
      <a href="#/cat/gift" data-nav="gift">گیفت کارت</a>
      <a href="#/cat/points" data-nav="points">پوینت بازی</a>
      <a href="#/cat/premium" data-nav="premium">اشتراک پرمیوم</a>
      <a href="#/faq" data-nav="faq">پرسش‌های متداول</a>
      <a href="#/contact" data-nav="contact">تماس با ما</a>
    </nav>
    <button class="cart-btn" id="cartBtn" type="button">سبد خرید <b id="cartCount">۰</b></button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    <span>© بازی‌کده — [نام قانونی و شماره ثبت]</span>
    <span>[نشانی پشتیبانی و ساعات کاری]</span>
  </div>
</footer>

<div class="drawer" id="drawer">
  <aside class="drawer__panel" role="dialog" aria-label="سبد خرید">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>سبد خرید</b>
      <button class="btn btn--ghost" id="closeCart" type="button">بستن</button>
    </div>
    <div class="drawer__list" id="cartList"></div>
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>جمع</span><span id="cartTotal">—</span></div>
    <button class="btn btn--main" id="checkout" type="button" style="justify-content:center">ادامهٔ خرید</button>
    <p class="note">این نسخه نمایشی است. هیچ پرداختی انجام نمی‌شود و هیچ سفارشی ثبت نمی‌شود.</p>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   Placeholder catalogue. Replace names, prices and delivery text
   with your real, authorised products. Prices are intentionally
   left as placeholders.
---------------------------------------------------------------- */
const CATS = {
  gift:    { title:'گیفت کارت', icon:'🎁', desc:'گیفت کارت‌های پلتفرم‌های مختلف' },
  points:  { title:'پوینت بازی', icon:'🎮', desc:'پوینت و واحد پول درون‌بازی' },
  premium: { title:'اشتراک پرمیوم', icon:'⭐', desc:'اشتراک‌های ویژه و امکانات تکمیلی' }
};

const PRODUCTS = [
  { id:'gift-1', cat:'gift', name:'گیفت کارت نمونه ۱', icon:'🎁', short:'[توضیح کوتاه محصول]', delivery:'[زمان تحویل]',
    options:[{label:'نمونه ۱',price:'[قیمت]'},{label:'نمونه ۲',price:'[قیمت]'}],
    steps:['محصول و مبلغ را انتخاب کنید.','ایمیل خود را وارد کنید.','پس از تأیید، کد به ایمیل شما ارسال می‌شود.'],
    faq:[{q:'کد را کجا وارد کنم؟',a:'[توضیح محل استفاده از کد]'},{q:'اگر کد کار نکرد چه کنم؟',a:'با پشتیبانی تماس بگیرید و شمارهٔ سفارش را بفرستید.'}] },
  { id:'points-1', cat:'points', name:'پوینت بازی نمونه', icon:'🎮', short:'[توضیح کوتاه محصول]', delivery:'[زمان تحویل]',
    options:[{label:'بسته کوچک',price:'[قیمت]'},{label:'بسته بزرگ',price:'[قیمت]'}],
    steps:['بازی و بسته را انتخاب کنید.','شناسهٔ کاربری خود را وارد کنید.','پس از پرداخت، پوینت به حساب شما اضافه می‌شود.'],
    faq:[{q:'شناسهٔ کاربری را از کجا پیدا کنم؟',a:'[راهنمای پیدا کردن شناسه در بازی]'}] },
  { id:'premium-1', cat:'premium', name:'اشتراک پرمیوم نمونه', icon:'⭐', short:'[توضیح کوتاه محصول]', delivery:'[زمان تحویل]',
    options:[{label:'یک ماهه',price:'[قیمت]'},{label:'سه ماهه',price:'[قیمت]'}],
    steps:['مدت اشتراک را انتخاب کنید.','ایمیل حساب خود را وارد کنید.','پس از تأیید، اشتراک فعال می‌شود.'],
    faq:[{q:'آیا اشتراک تمدید می‌شود؟',a:'[توضیح تمدید خودکار]'}] }
];

const state = {
  cart: JSON.parse(localStorage.getItem('bk_cart') || '[]')
};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveCart = () => { localStorage.setItem('bk_cart', JSON.stringify(state.cart)); paintCart(); };

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('is-on'), 2200);
}

/* ---------- views ---------- */
function viewHome(){
  return `
  <section class="hero">
    <div>
      <h1>خرید دیجیتال بازی، <span>سریع و مطمئن</span></h1>
      <p>گیفت کارت، پوینت بازی و اشتراک‌های پرمیوم در یک جا. [توضیح خدمات و شیوهٔ تحویل]</p>
      <div class="hero__btns">
        <a class="btn btn--main" href="#/cat/gift">مشاهدهٔ محصولات</a>
        <a class="btn" href="#/faq">راهنمای خرید</a>
      </div>
      <div class="badges">
        <span class="badge badge--ok">تحویل [زمان]</span>
        <span class="badge">پشتیبانی [ساعات کاری]</span>
        <span class="badge">پرداخت امن [درگاه]</span>
      </div>
    </div>
    <div class="hero__panel">
      <h3>چطور سفارش بدهم؟</h3>
      <div class="step"><i>۱</i><span>محصول مورد نظر را انتخاب کنید.</span></div>
      <div class="step"><i>۲</i><span>اطلاعات لازم را وارد کنید.</span></div>
      <div class="step"><i>۳</i><span>پرداخت و تحویل طبق زمان اعلام‌شده.</span></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec__head"><h2>دسته‌بندی‌ها</h2><p>از یکی از دسته‌ها شروع کنید</p></div>
    <div class="cats">
      ${Object.entries(CATS).map(([id,c]) => `
        <a class="cat" href="#/cat/${id}">
          <div class="cat__ic">${c.icon}</div>
          <div><h3>${esc(c.title)}</h3><small>${esc(c.desc)}</small></div>
        </a>`).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="sec__head"><h2>محصولات</h2><p>نمونه‌ها — قیمت‌ها به‌زودی</p></div>
    ${productGrid(PRODUCTS)}
  </section>`;
}

function viewCat(id){
  const c = CATS[id];
  if (!c) return viewNotFound();
  const list = PRODUCTS.filter(p => p.cat === id);
  return `
  <div class="crumbs"><a href="#/">خانه</a> / ${esc(c.title)}</div>
  <div class="sec__head"><h2>${c.icon} ${esc(c.title)}</h2><p>${esc(c.desc)}</p></div>
  ${list.length ? productGrid(list) : `<div class="empty"><b>هنوز محصولی در این دسته نیست</b>به‌زودی اضافه می‌شود.</div>`}`;
}

function productGrid(list){
  return `<div class="grid">${list.map(p => `
    <a class="card" href="#/product/${p.id}">
      <div class="card__art">${p.icon}</div>
      <div class="card__body">
        <span class="card__tag">${esc(CATS[p.cat].title)}</span>
        <h3>${esc(p.name)}</h3>
        <div class="card__meta">
          <span class="price">[قیمت]</span>
          <span class="mini">مشاهده</span>
        </div>
      </div>
    </a>`).join('')}</div>`;
}

function viewProduct(id){
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return viewNotFound();
  const c = CATS[p.cat];
  return `
  <div class="crumbs"><a href="#/">خانه</a> / <a href="#/cat/${p.cat}">${esc(c.title)}</a> / ${esc(p.name)}</div>
  <section class="prod">
    <div class="prod__art">${p.icon}</div>
    <div>
      <span class="card__tag">${esc(c.title)}</span>
      <h1>${esc(p.name)}</h1>
      <p class="prod__lede">${esc(p.short)}</p>
      <div class="badges"><span class="badge badge--ok">تحویل: ${esc(p.delivery)}</span></div>

      <div class="box">
        <h3>انتخاب گزینه</h3>
        <div class="opts" id="opts">
          ${p.options.map((o,i) => `
            <div class="opt ${i===0?'is-on':''}" data-i="${i}">
              <b>${esc(o.label)}</b><small>${esc(o.price)}</small>
            </div>`).join('')}
        </div>
        <label for="pEmail">ایمیل</label>
        <input class="field" id="pEmail" type="email" placeholder="you@example.com" autocomplete="email">
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn--main" id="addBtn" type="button">افزودن به سبد</button>
        </div>
        <p class="note">این نسخه نمایشی است و پرداختی انجام نمی‌شود.</p>
      </div>

      <div class="box">
        <h3>نحوه استفاده و فعال‌سازی</h3>
        <ol class="steps-list">${p.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      </div>

      <div class="box faq">
        <h3>پرسش‌های متداول</h3>
        ${p.faq.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}
      </div>
    </div>
  </section>`;
}

function viewFaq(){
  const items = [
    ['چطور سفارش بدهم؟','محصول را انتخاب کنید، گزینه و ایمیل را وارد کنید و سفارش را به سبد اضافه کنید.'],
    ['تحویل چقدر طول می‌کشد؟','[زمان تحویل هر دسته]'],
    ['اگر مشکلی پیش آمد چه کنم؟','با پشتیبانی تماس بگیرید و شمارهٔ سفارش را ارسال کنید.']
  ];
  return `
  <div class="crumbs"><a href="#/">خانه</a> / پرسش‌های متداول</div>
  <div class="sec__head"><h2>پرسش‌های متداول</h2></div>
  <div class="box faq">${items.map(([q,a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>`;
}

function viewContact(){
  return `
  <div class="crumbs"><a href="#/">خانه</a> / تماس با ما</div>
  <div class="sec__head"><h2>تماس با ما</h2></div>
  <div class="box">
    <p style="color:var(--mute)">پیام خود را بنویسید. [نشانی پشتیبانی] — [ساعات پاسخ‌گویی]</p>
    <label for="cName">نام</label><input class="field" id="cName">
    <label for="cMsg">پیام</label><textarea class="field" id="cMsg" rows="4"></textarea>
    <div style="margin-top:14px"><button class="btn btn--main" id="sendMsg" type="button">ارسال</button></div>
    <p class="note">این فرم نمایشی است و پیامی ارسال نمی‌شود.</p>
  </div>`;
}

function viewNotFound(){
  return `<div class="empty" style="margin-top:40px"><b>صفحه پیدا نشد</b><a class="btn" href="#/">بازگشت به خانه</a></div>`;
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  let html, nav = 'home';
  if (!parts.length) html = viewHome();
  else if (parts[0] === 'cat') { html = viewCat(parts[1]); nav = parts[1]; }
  else if (parts[0] === 'product') html = viewProduct(parts[1]);
  else if (parts[0] === 'faq') { html = viewFaq(); nav = 'faq'; }
  else if (parts[0] === 'contact') { html = viewContact(); nav = 'contact'; }
  else html = viewNotFound();
  $('#app').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('is-on', a.dataset.nav === nav));
  window.scrollTo({top:0, behavior:'instant'});
  bind(parts);
}

/* ---------- interactions ---------- */
function bind(parts){
  if (parts[0] === 'product') {
    const p = PRODUCTS.find(x => x.id === parts[1]); if (!p) return;
    let sel = 0;
    document.querySelectorAll('#opts .opt').forEach(el => el.addEventListener('click', () => {
      sel = +el.dataset.i;
      document.querySelectorAll('#opts .opt').forEach(o => o.classList.toggle('is-on', o === el));
    }));
    $('#addBtn').addEventListener('click', () => {
      const email = $('#pEmail').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('ایمیل معتبر وارد کنید.');
      const o = p.options[sel];
      state.cart.push({ id:p.id, name:p.name, option:o.label, email, key:Date.now() });
      saveCart();
      toast('به سبد اضافه شد');
    });
  }
  if (parts[0] === 'contact') {
    $('#sendMsg').addEventListener('click', () => toast('این فرم نمایشی است.'));
  }
}

function paintCart(){
  $('#cartCount').textContent = state.cart.length;
  const list = $('#cartList');
  if (!state.cart.length) {
    list.innerHTML = `<div class="empty"><b>سبد خرید خالی است</b>محصولی انتخاب کنید تا اینجا نمایش داده شود.</div>`;
    $('#cartTotal').textContent = '—';
    $('#checkout').disabled = true;
    return;
  }
  list.innerHTML = state.cart.map((it, i) => `
    <div class="line">
      <div><b>${esc(it.name)}</b><br><small>${esc(it.option)} · ${esc(it.email)}</small></div>
      <button class="btn btn--ghost" data-rm="${i}" type="button">حذف</button>
    </div>`).join('');
  $('#cartTotal').textContent = '[قیمت]';
  $('#checkout').disabled = false;
  list.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    state.cart.splice(+b.dataset.rm, 1); saveCart();
  }));
}

$('#cartBtn').addEventListener('click', () => $('#drawer').classList.add('is-open'));
$('#closeCart').addEventListener('click', () => $('#drawer').classList.remove('is-open'));
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') $('#drawer').classList.remove('is-open'); });
$('#checkout').addEventListener('click', () => toast('این نسخه نمایشی است و پرداختی انجام نمی‌شود.'));
window.addEventListener('hashchange', route);
paintCart();
route();
</script>
</body>
</html>
