<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Request desk · SIFT team</title>
<link rel="icon" type="image/png" href="assets/images/sift-logo.png">
<style>
@font-face{font-family:'Outfit';src:url('assets/fonts/outfit-latin-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('assets/fonts/jetbrainsmono-latin-var.woff2') format('woff2');font-weight:100 800;font-display:swap}
:root{--bg:#08090B;--panel:#0C0E12;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--ink:#F2F5F8;--mute:rgba(226,235,245,.6);--dim:rgba(226,235,245,.38);--blue:#57B8FF;--ok:#4ED08A;--warn:#E9B75C;--bad:#F2685F}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.6 'Outfit',system-ui,sans-serif;min-height:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header img{width:30px;height:30px;object-fit:contain}
header b{font-weight:600;letter-spacing:.14em}
header .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font:500 .85rem 'Outfit';cursor:pointer}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn--p{background:linear-gradient(180deg,#1F4F7D,#163B5E);border-color:rgba(87,184,255,.45)}
.btn--ok{color:var(--ok);border-color:rgba(78,208,138,.4)}
.btn--bad{color:var(--bad);border-color:rgba(242,104,95,.4)}
.wrap{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 60px)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 60px)}
.filters{display:flex;gap:6px;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 10px;font:500 .75rem 'JetBrains Mono';cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.filters button.on{color:#fff;border-color:var(--blue)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;color:var(--ink);cursor:pointer;font:inherit}
.item:hover{background:rgba(255,255,255,.03)}
.item.on{background:rgba(87,184,255,.08)}
.item b{font-weight:500}
.item small{display:block;color:var(--dim);font:400 .76rem 'JetBrains Mono';margin-top:2px}
.pill{font:500 .66rem 'JetBrains Mono';letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--mute)}
.pill--queued{color:var(--warn);border-color:rgba(233,183,92,.35)}
.pill--provisioning{color:var(--blue);border-color:rgba(87,184,255,.35)}
.pill--ready{color:var(--ok);border-color:rgba(78,208,138,.35)}
.pill--cancelled{color:var(--bad);border-color:rgba(242,104,95,.35)}
.detail{padding:24px 28px;max-width:820px}
.detail h2{font-weight:500;font-size:1.4rem;margin:0 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.grid div small{display:block;color:var(--dim);font:500 .66rem 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;color:var(--mute)}
input,textarea,select{width:100%;background:#0B0D11;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--ink);font:400 .9rem 'Outfit';outline:none}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{border-color:var(--blue)}
.msg{font-size:.85rem;min-height:1.2em;margin-top:6px}
.gate{max-width:380px;margin:90px auto;padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.empty{padding:50px 20px;color:var(--dim);text-align:center}
.toast{position:fixed;bottom:20px;right:20px;background:#12161C;border:1px solid var(--line2);border-radius:10px;padding:12px 16px;font-size:.88rem;transform:translateY(160%);transition:.3s;max-width:360px;z-index:9}
.toast.show{transform:none}
.hide{display:none!important}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.list{max-height:none;border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}
</style>
<script src="config.js"></script>
</head>
<body>
<header>
  <img src="assets/images/sift-logo.png" alt=""><b>SIFT</b><span class="mono" style="color:var(--dim);font-size:.8rem">request desk</span>
  <div class="r"><span class="mono" id="count" style="color:var(--dim);font-size:.8rem"></span><button class="btn hide" id="signout">Sign out</button></div>
</header>

<div id="gate" class="gate">
  <h2 style="font-weight:500;margin:0 0 6px">Team sign-in</h2>
  <p style="color:var(--mute);font-size:.9rem;margin:0 0 18px">Enter the admin token configured on the server.</p>
  <div class="field"><label for="tok">Admin token</label><input id="tok" type="password" autocomplete="off"></div>
  <button class="btn btn--p" id="go">Open request desk</button>
  <div class="msg" id="gmsg" style="color:var(--bad)"></div>
</div>

<div id="app" class="wrap hide">
  <aside class="list">
    <div class="filters" id="filters"></div>
    <div id="items"></div>
  </aside>
  <main class="detail" id="detail"><div class="empty">Select a request to work on it.</div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const STATES=['all','queued','provisioning','ready','cancelled'];
  let token=sessionStorage.getItem('sift.admin')||'';
  let all=[], filter='all', selected=null;
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(m){const t=$('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
  async function api(path,opt={}){
    const r=await fetch((window.SIFT_CONFIG&&window.SIFT_CONFIG.API_BASE||'')+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opt.headers||{})}});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(body.error||'Request failed'),{status:r.status});
    return body;
  }
  function open(){ $('gate').classList.add('hide'); $('app').classList.remove('hide'); $('signout').classList.remove('hide'); }
  function close(){ $('gate').classList.remove('hide'); $('app').classList.add('hide'); $('signout').classList.add('hide'); }

  async function load(){
    try{
      const d=await api('/api/admin/requests');
      all=d.requests; open(); render();
    }catch(e){
      if(e.status===401){sessionStorage.removeItem('sift.admin');token='';$('gmsg').textContent='That token is not correct.';close();}
      else if(e.status===503){ $('gmsg').textContent=e.message; close(); }
      else { toast(esc(e.message)); }
    }
  }

  function render(){
    $('count').textContent=all.length+' total · '+all.filter(r=>r.status==='queued').length+' waiting';
    $('filters').innerHTML=STATES.map(s=>`<button class="${filter===s?'on':''}" data-f="${s}">${s}</button>`).join('');
    $('filters').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
    const list=all.filter(r=>filter==='all'||r.status===filter);
    $('items').innerHTML=list.length?list.map(r=>`<button class="item ${selected&&selected.id===r.id?'on':''}" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.name)}.sift.gg</b><span class="pill pill--${r.status}">${r.status}</span></div>
        <small>${r.id} · ${esc(r.plan)} · ${esc(r.region)} · ${esc(r.software)} ${esc(r.version)}</small>
        <small>${new Date(r.createdAt).toLocaleString('en-GB')}</small></button>`).join('')
      :'<div class="empty">No requests in this view.</div>';
    $('items').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=all.find(r=>r.id===b.dataset.id);render();showDetail();});
  }

  function showDetail(){
    const r=selected; if(!r){ $('detail').innerHTML='<div class="empty">Select a request to work on it.</div>'; return; }
    $('detail').innerHTML=`
      <div class="pill pill--${r.status}" style="display:inline-block">${r.status}</div>
      <h2 style="margin-top:10px">${esc(r.name)}.sift.gg</h2>
      <div class="mono" style="color:var(--dim);font-size:.82rem">${r.id} · requested ${new Date(r.createdAt).toLocaleString('en-GB')}</div>
      <div class="grid">
        <div><small>Plan</small>${esc(r.plan)}</div>
        <div><small>Region</small>${esc(r.region)}</div>
        <div><small>Software</small>${esc(r.software)} ${esc(r.version)}</div>
        <div><small>Contact</small><a href="mailto:${esc(r.email)}" style="color:var(--blue)">${esc(r.email)}</a></div>
        <div style="grid-column:1/-1"><small>Player's note</small>${r.note?esc(r.note):'<span style="color:var(--dim)">None</span>'}</div>
      </div>
      <div class="field"><label for="st">Status</label>
        <select id="st">${['queued','provisioning','ready','cancelled'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="ad">Server address (shown to the player when ready)</label><input id="ad" value="${esc(r.address)}" placeholder="${esc(r.name)}.sift.gg"></div>
      <div class="field"><label for="pm">Message to the player (max 300)</label><textarea id="pm" maxlength="300" placeholder="e.g. Your server is installed. Join with the address above.">${esc(r.publicMessage)}</textarea></div>
      <div class="field"><label for="in">Internal note (team only)</label><textarea id="in" maxlength="1000" placeholder="Node, IP block, who is on it">${esc(r.internalNote)}</textarea></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn--p" id="save">Save</button>
        <button class="btn btn--ok" id="ready">Mark ready</button>
        <button class="btn btn--bad" id="cancel">Cancel request</button>
        <span class="msg" id="dmsg"></span>
      </div>`;
    const save=async (overrides={})=>{
      const body={status:$('st').value,address:$('ad').value.trim(),publicMessage:$('pm').value.trim(),internalNote:$('in').value.trim(),...overrides};
      try{
        const d=await api('/api/admin/requests/'+r.id,{method:'PATCH',body:JSON.stringify(body)});
        all=all.map(x=>x.id===r.id?{...x,...d.request}:x); selected=all.find(x=>x.id===r.id);
        render(); showDetail(); toast('Saved. The player sees the update on their status page.');
      }catch(e){ $('dmsg').style.color='var(--bad)'; $('dmsg').textContent=e.message; }
    };
    $('save').onclick=()=>save();
    $('ready').onclick=()=>{ $('st').value='ready'; save({status:'ready'}); };
    $('cancel').onclick=()=>{ if(confirm('Cancel this request? The player will see it as cancelled.')) save({status:'cancelled'}); };
  }

  $('go').onclick=()=>{ token=$('tok').value.trim(); if(!token){$('gmsg').textContent='Enter the token.';return;} sessionStorage.setItem('sift.admin',token); $('gmsg').textContent=''; load(); };
  $('tok').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
  $('signout').onclick=()=>{sessionStorage.removeItem('sift.admin');token='';all=[];selected=null;close();};
  if(token) load(); else close();
  setInterval(()=>{ if(token && !$('app').classList.contains('hide')) load(); },30000);
})();
</script>
</body>
</html>
