<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · SIFT</title>
<style>
@font-face{font-family:'Outfit';src:url('../assets/fonts/Outfit-Latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('../assets/fonts/JetBrainsMono-Latin.woff2') format('woff2');font-weight:100 800;font-display:swap}

:root{--bg:#08090B;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--ink:#F2F5F8;--mute:rgba(226,235,245,.6);--dim:rgba(226,235,245,.38);--blue:#57B8FF;--bad:#F2685F;--warn:#E9B75C}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:300 16px/1.6 'Outfit',system-ui,sans-serif}
body{background:radial-gradient(700px 420px at 50% 0%,rgba(87,184,255,.10),transparent 70%),var(--bg);display:grid;place-items:center;padding:24px}
a{color:var(--blue);text-decoration:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.box{width:100%;max-width:420px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;color:inherit;text-decoration:none}
.brand img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(87,184,255,.3))}
.brand b{font-weight:600;letter-spacing:.16em;font-size:1rem}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:32px}
h1{font-weight:500;font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mute);font-size:.94rem;margin:0 0 26px}
.field{display:grid;gap:8px;margin-bottom:16px}
.field label{font-size:.84rem;color:var(--mute);display:flex;justify-content:space-between}
input{width:100%;background:#0B0D11;border:1px solid var(--line2);border-radius:9px;padding:12px 14px;color:var(--ink);font:400 .95rem 'Outfit';outline:none}
input:focus{border-color:var(--blue)}
input.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:.82rem;min-height:1.1em;margin-top:-6px}
.btn{width:100%;padding:13px;border-radius:999px;border:1px solid rgba(87,184,255,.45);background:linear-gradient(180deg,#1F4F7D,#163B5E);color:#fff;font:500 .95rem 'Outfit';cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alert{border:1px solid rgba(233,183,92,.35);background:rgba(233,183,92,.07);color:#F3D9A4;border-radius:10px;padding:12px 14px;font-size:.88rem;margin-bottom:18px;display:none}
.alert.show{display:block}
.row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--dim);margin-top:20px}
.foot{text-align:center;color:var(--dim);font-size:.9rem;margin-top:22px}
</style>
<style id="sift-progress-style">
#siftProgress{position:fixed;top:0;left:0;right:0;height:3px;z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s ease}
#siftProgress::before{content:"";position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#3ddc97,#5aa9ff,#3ddc97);background-size:200% 100%;box-shadow:0 0 12px rgba(61,220,151,.6)}
#siftProgress.on{opacity:1}
#siftProgress.run::before{animation:siftRun 1.6s cubic-bezier(.2,.7,.2,1) forwards,siftShine 1.2s linear infinite}
#siftProgress.done::before{transform:scaleX(1);transition:transform .25s ease}
@keyframes siftRun{0%{transform:scaleX(0)}60%{transform:scaleX(.75)}100%{transform:scaleX(.92)}}
@keyframes siftShine{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){#siftProgress.run::before{animation:none;transform:scaleX(.5)}}
</style>
<style id="sift-fa-type">
@font-face{font-family:'Outfit';src:url('../assets/fonts/YekanBakh-Light.woff2') format('woff2');font-weight:300;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'Outfit';src:url('../assets/fonts/YekanBakh-Regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'Outfit';src:url('../assets/fonts/YekanBakh-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'Outfit';src:url('../assets/fonts/YekanBakh-Bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'JetBrains Mono';src:url('../assets/fonts/YekanBakh-Light.woff2') format('woff2');font-weight:300;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'JetBrains Mono';src:url('../assets/fonts/YekanBakh-Regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'JetBrains Mono';src:url('../assets/fonts/YekanBakh-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:'JetBrains Mono';src:url('../assets/fonts/YekanBakh-Bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">

<style id="sift-smooth">
html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#siftScroll{position:fixed;top:0;left:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#4ea8ff,#3ddc97);box-shadow:0 0 10px rgba(78,168,255,.6);z-index:100000;pointer-events:none}
body.scrolled header,body.scrolled .nav,body.scrolled .topbar{box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="siftProgress" aria-hidden="true"></div>
<main class="box">
  <a class="brand" href="../"><img src="../assets/images/sift-logo.png" alt="SIFT"><b>SIFT</b></a>
  <div class="panel">
    <h1>Sign in to your panel</h1>
    <p class="sub">Manage your servers, billing and tickets.</p>
    <div class="alert" id="alert" role="alert"></div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><div class="err" id="eErr"></div></div>
      <div class="field"><label for="pw">Password <a href="#" id="forgot" style="font-size:.82rem">Forgot?</a></label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="pErr"></div></div>
      <button class="btn" id="submit" type="submit">Sign in</button>
    </form>
    <div class="row"><span>Two-factor is enforced on billing changes.</span></div>
  </div>
  <p class="foot">New to SIFT? <a href="../register/">Create an account</a></p>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const LOCK_KEY='sift.v1.lock', FAIL_KEY='sift.v1.fails';
  const next=new URLSearchParams(location.search).get('next')||'../dashboard/';
  let lockTimer=null;
  function users(){try{return JSON.parse(localStorage.getItem('sift.v1.users'))||[]}catch(e){return[]}}

  function lockedUntil(){return +localStorage.getItem(LOCK_KEY)||0}
  function renderLock(){
    const left=Math.ceil((lockedUntil()-Date.now())/1000);
    const btn=$('submit');
    if(left>0){btn.disabled=true;$('alert').className='alert show';$('alert').textContent='Too many attempts. Try again in '+left+' seconds.';clearTimeout(lockTimer);lockTimer=setTimeout(renderLock,1000);}
    else{btn.disabled=false;if($('alert').textContent.indexOf('Too many')===0){$('alert').className='alert';}}
  }
  renderLock();

  $('forgot').onclick=e=>{e.preventDefault();const em=$('email').value.trim();$('alert').className='alert show';$('alert').textContent=em&&/^\S+@\S+\.\S+$/.test(em)?'If an account exists for '+em+', a reset link is on its way.':'Enter your email above first, then tap Forgot again.';};

  $('form').addEventListener('submit',e=>{
    e.preventDefault();
    const email=$('email').value.trim().toLowerCase(), pw=$('pw').value;
    let bad=false;
    $('eErr').textContent=!email?'Enter your email address.':!/^\S+@\S+\.\S+$/.test(email)?'That doesn\u2019t look like a valid email address.':'';
    $('pErr').textContent=!pw?'Enter your password.':'';
    $('email').classList.toggle('bad',!!$('eErr').textContent);
    $('pw').classList.toggle('bad',!!$('pErr').textContent);
    if($('eErr').textContent||$('pErr').textContent) return;
    if(lockedUntil()>Date.now()) return renderLock();

    const u=users().find(x=>x.email===email);
    const valid=u && u.pw===btoa(unescape(encodeURIComponent(pw)));
    if(!valid){
      const fails=(+localStorage.getItem(FAIL_KEY)||0)+1;
      localStorage.setItem(FAIL_KEY,fails);
      if(fails>=3){localStorage.setItem(LOCK_KEY,Date.now()+45000);localStorage.setItem(FAIL_KEY,0);renderLock();return;}
      $('alert').className='alert show';
      $('alert').textContent=u?'That password doesn\u2019t match this account. '+(3-fails)+' attempts left before a short lock.':'We couldn\u2019t find an account with that email and password.';
      return;
    }
    localStorage.setItem(FAIL_KEY,0);
    localStorage.setItem('sift.v1.session',JSON.stringify({email:u.email,first:u.first,accountId:u.accountId,createdAt:u.createdAt}));
    location.href=next;
  });
})();
</script>
<script id="sift-progress-script">
(function(){
  var bar=document.getElementById('siftProgress'); if(!bar) return;
  var t;
  function start(){ clearTimeout(t); bar.classList.remove('done'); bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('on','run'); }
  function finish(){ bar.classList.add('done'); t=setTimeout(function(){ bar.classList.remove('on','run','done'); },350); }
  window.addEventListener('DOMContentLoaded', finish);
  window.addEventListener('load', finish);
  window.addEventListener('pageshow', function(e){ if(e.persisted) finish(); });
  document.addEventListener('click', function(e){
    var a=e.target.closest && e.target.closest('a[href]'); if(!a) return;
    if(a.target==='_blank'||e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;
    var u; try{ u=new URL(a.href,location.href);}catch(_){return;}
    if(u.origin!==location.origin) return;
    if(u.pathname===location.pathname && u.search===location.search && u.hash) return;
    start();
  }, true);
  window.addEventListener('beforeunload', function(){ start(); });
})();
</script>
<div id="siftScroll" aria-hidden="true"></div>
<script id="sift-smooth-js">
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bar=document.getElementById('siftScroll');
  function onScroll(){
    var h=document.documentElement; var max=h.scrollHeight-h.clientHeight;
    var p=max>0?(h.scrollTop/max):0;
    if(bar) bar.style.transform='scaleX('+p.toFixed(4)+')';
    document.body.classList.toggle('scrolled', h.scrollTop>12);
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  // smooth in-page anchors with fixed-header offset
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    var id=a.getAttribute('href').slice(1); if(!id) return;
    var t=document.getElementById(id); if(!t) return;
    e.preventDefault();
    var y=t.getBoundingClientRect().top+scrollY-(document.querySelector('header')?document.querySelector('header').offsetHeight:0)-16;
    scrollTo({top:y,behavior:reduce?'auto':'smooth'});
    history.pushState(null,'','#'+id);
  });
})();
</script>
</body>
</html>
