<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account · SIFT</title>
<link rel="icon" type="image/png" href="assets/images/sift-logo.png">
<style>
@font-face{font-family:'Outfit';src:url('assets/fonts/outfit-latin-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('assets/fonts/jetbrainsmono-latin-var.woff2') format('woff2');font-weight:100 800;font-display:swap}

:root{--bg:#08090B;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--ink:#F2F5F8;--mute:rgba(226,235,245,.6);--dim:rgba(226,235,245,.38);--blue:#57B8FF;--bad:#F2685F;--ok:#4ED08A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:300 16px/1.6 'Outfit',system-ui,sans-serif}
body{background:radial-gradient(700px 420px at 50% 0%,rgba(87,184,255,.10),transparent 70%),var(--bg);display:grid;place-items:center;padding:28px 18px}
a{color:var(--blue);text-decoration:none}
.box{width:100%;max-width:460px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;color:inherit;text-decoration:none}
.brand img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(87,184,255,.3))}
.brand b{font-weight:600;letter-spacing:.16em}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:32px}
h1{font-weight:500;font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mute);font-size:.94rem;margin:0 0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:.84rem;color:var(--mute)}
input{width:100%;background:#0B0D11;border:1px solid var(--line2);border-radius:9px;padding:12px 14px;color:var(--ink);font:400 .95rem 'Outfit';outline:none}
input:focus{border-color:var(--blue)}input.bad{border-color:var(--bad)}
.meter{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%;width:0;transition:.3s}
.err{color:var(--bad);font-size:.82rem;min-height:1.1em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--mute);margin:6px 0 18px}
.check input{width:auto;margin-top:4px}
.btn{width:100%;padding:13px;border-radius:999px;border:1px solid rgba(87,184,255,.45);background:linear-gradient(180deg,#1F4F7D,#163B5E);color:#fff;font:500 .95rem 'Outfit';cursor:pointer}
.foot{text-align:center;color:var(--dim);font-size:.9rem;margin-top:20px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
</style>
<style id="sift-progress-style">
#siftProgress{position:fixed;top:0;left:0;right:0;height:3px;z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s ease}
#siftProgress::before{content:"";position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#3ddc97,#5aa9ff,#3ddc97);background-size:200% 100%;box-shadow:0 0 12px rgba(61,220,151,.6)}
#siftProgress.on{opacity:1}
#siftProgress.run::before{animation:siftRun 1.6s cubic-bezier(.2,.7,.2,1) forwards,siftShine 1.2s linear infinite}
#siftProgress.done::before{transform:scaleX(1);transition:transform .25s ease}
@keyframes siftRun{0%{transform:scaleX(0)}60%{transform:scaleX(.75)}100%{transform:scaleX(.92)}}
@keyframes siftShine{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){#siftProgress.run::before{animation:none;transform:scaleX(.5)}}
</style>
</head>
<body>
<div id="siftProgress" aria-hidden="true"></div>
<main class="box">
  <a class="brand" href="./"><img src="assets/images/sift-logo.png" alt="SIFT"><b>SIFT</b></a>
  <div class="panel">
    <h1>Create your account</h1>
    <p class="sub">Free to join. You only pay when a server is running.</p>
    <form id="form" novalidate>
      <div class="two">
        <div class="field"><label for="first">First name</label><input id="first" autocomplete="given-name"><div class="err" id="fErr"></div></div>
        <div class="field"><label for="last">Last name</label><input id="last" autocomplete="family-name"><div class="err" id="lErr"></div></div>
      </div>
      <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email"><div class="err" id="eErr"></div></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password"><div class="meter"><i id="meter"></i></div><div class="err" id="pErr"></div></div>
      <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"><div class="err" id="cErr"></div></div>
      <label class="check"><input type="checkbox" id="terms"> I agree to the Terms of Service and Privacy Policy, and I am at least 18 or have a guardian's consent.</label>
      <div class="err" id="tErr" style="margin:-8px 0 12px"></div>
      <button class="btn" type="submit">Create account</button>
    </form>
  </div>
  <p class="foot">Already have an account? <a href="login">Sign in</a></p>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const q=new URLSearchParams(location.search);
  const next=q.get('next')||'dashboard';
  function users(){try{return JSON.parse(localStorage.getItem('sift.v1.users'))||[]}catch(e){return[]}}
  function strength(p){let s=0;if(p.length>=10)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s;}
  $('pw').addEventListener('input',e=>{const s=strength(e.target.value);const m=$('meter');m.style.width=(s*25)+'%';m.style.background=s<2?'#F2685F':s<4?'#E9B75C':'#4ED08A';});
  const code=s=>{const c=s.toLowerCase().replace(/[^a-z0-9]/g,'');return c.slice(0,4).toUpperCase().padEnd(4,'X');};
  $('form').addEventListener('submit',e=>{
    e.preventDefault();
    const first=$('first').value.trim(), last=$('last').value.trim(), email=$('email').value.trim().toLowerCase(), pw=$('pw').value, pw2=$('pw2').value;
    const errs={
      fErr: first?'':'Add your first name.',
      lErr: last?'':'Add your last name.',
      eErr: !email?'Enter an email address.':!/^\S+@\S+\.\S+$/.test(email)?'That doesn\u2019t look like a valid email address.':users().some(u=>u.email===email)?'An account already exists for this email. Sign in instead.':'',
      pErr: pw.length<10?'Use at least 10 characters.':strength(pw)<2?'Add numbers or symbols to make it harder to guess.':'',
      cErr: pw2!==pw?'Passwords don\u2019t match yet.':''
    };
    let ok=true;
    Object.entries(errs).forEach(([k,v])=>{$(k).textContent=v;if(v){ok=false;}});
    ['first','last','email','pw','pw2'].forEach(id=>{const k={first:'fErr',last:'lErr',email:'eErr',pw:'pErr',pw2:'cErr'}[id];$(id).classList.toggle('bad',!!errs[k]);});
    $('tErr').textContent=$('terms').checked?'':'Please accept the terms to continue.';
    if(!$('terms').checked) ok=false;
    if(!ok) return;
    const acc={id:'acc_'+Date.now().toString(36),first:first+' '+last,email,pw:btoa(unescape(encodeURIComponent(pw))),accountId:code(first)+'-'+(10+Math.floor(Math.random()*89))+'-'+(1+Math.floor(Math.random()*9)),createdAt:new Date().toISOString()};
    localStorage.setItem('sift.v1.users',JSON.stringify([...users(),acc]));
    localStorage.setItem('sift.v1.session',JSON.stringify({email,first:first+' '+last,accountId:acc.accountId,createdAt:acc.createdAt}));
    location.href=next;
  });
})();
</script>
<script id="sift-progress-script">
(function(){
  var bar=document.getElementById('siftProgress'); if(!bar) return;
  var t;
  function start(){ clearTimeout(t); bar.classList.remove('done'); bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('on','run'); }
  function finish(){ bar.classList.add('done'); t=setTimeout(function(){ bar.classList.remove('on','run','done'); },350); }
  window.addEventListener('DOMContentLoaded', finish);
  window.addEventListener('load', finish);
  window.addEventListener('pageshow', function(e){ if(e.persisted) finish(); });
  document.addEventListener('click', function(e){
    var a=e.target.closest && e.target.closest('a[href]'); if(!a) return;
    if(a.target==='_blank'||e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;
    var u; try{ u=new URL(a.href,location.href);}catch(_){return;}
    if(u.origin!==location.origin) return;
    if(u.pathname===location.pathname && u.search===location.search && u.hash) return;
    start();
  }, true);
  window.addEventListener('beforeunload', function(){ start(); });
})();
</script>
</body>
</html>
