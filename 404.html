<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'unsafe-inline'">
<title>404 · Page not found</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --line: #232837;
    --text: #e8ebf3;
    --muted: #8a92a6;
    --accent: #3ddc97;
    --accent-2: #5aa9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(61,220,151,.12), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, rgba(90,169,255,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    min-height: 100vh;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .25;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .1; } 50% { opacity: .7; } }

  main {
    text-align: center;
    padding: 32px 24px;
    max-width: 640px;
    position: relative;
    z-index: 1;
  }

  .blocks {
    display: flex; justify-content: center; gap: 14px;
    margin-bottom: 28px;
    height: 120px; align-items: flex-end;
  }
  .block {
    width: 64px; height: 64px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,.12);
    background: linear-gradient(160deg, #1b2030, #10131b);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4);
    position: relative;
    animation: drop 2.6s cubic-bezier(.3,.7,.2,1) infinite;
  }
  .block:nth-child(1) { animation-delay: 0s; }
  .block:nth-child(2) { animation-delay: .2s; }
  .block:nth-child(3) { animation-delay: .4s; }
  .block.green::after, .block.blue::after {
    content: ""; position: absolute; inset: 10px;
    border-radius: 6px; opacity: .85;
  }
  .block.green::after { background: linear-gradient(135deg, var(--accent), #1f8f63); }
  .block.blue::after  { background: linear-gradient(135deg, var(--accent-2), #2c6fbf); }
  @keyframes drop {
    0%   { transform: translateY(-140px) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; }
    45%  { transform: translateY(0) rotate(0deg); }
    60%  { transform: translateY(-8px) rotate(2deg); }
    70%  { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(0); opacity: 1; }
  }

  .code {
    font-size: clamp(88px, 20vw, 164px);
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: 1;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 200% 0; } }

  h1 { font-size: 24px; font-weight: 650; margin: 12px 0 10px; }
  p.lead { color: var(--muted); line-height: 1.6; font-size: 16px; }

  .card {
    margin: 28px auto 0;
    background: rgba(18,21,29,.7);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: left;
    backdrop-filter: blur(6px);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    color: var(--muted);
  }
  .card .ok { color: var(--accent); }
  .card .err { color: #ff6b6b; }
  .cursor {
    display: inline-block; width: 8px; height: 16px; background: var(--accent);
    vertical-align: -3px; margin-left: 4px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 10px;
    text-decoration: none; font-weight: 600; font-size: 15px;
    border: 1px solid var(--line); color: var(--text);
    background: var(--panel);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #2bb67c);
    color: #06140e; border-color: transparent;
  }
  .btn.primary:hover { border-color: transparent; box-shadow: 0 10px 30px rgba(61,220,151,.25); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .block { transform: none; }
  }
</style>
<style id="sift-progress-style">
#siftProgress{position:fixed;top:0;left:0;right:0;height:3px;z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s ease}
#siftProgress::before{content:"";position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#3ddc97,#5aa9ff,#3ddc97);background-size:200% 100%;box-shadow:0 0 12px rgba(61,220,151,.6)}
#siftProgress.on{opacity:1}
#siftProgress.run::before{animation:siftRun 1.6s cubic-bezier(.2,.7,.2,1) forwards,siftShine 1.2s linear infinite}
#siftProgress.done::before{transform:scaleX(1);transition:transform .25s ease}
@keyframes siftRun{0%{transform:scaleX(0)}60%{transform:scaleX(.75)}100%{transform:scaleX(.92)}}
@keyframes siftShine{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){#siftProgress.run::before{animation:none;transform:scaleX(.5)}}
</style>
</head>
<body>
<div id="siftProgress" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main>
    <div class="blocks" aria-hidden="true">
      <div class="block green"></div>
      <div class="block"></div>
      <div class="block blue"></div>
    </div>

    <div class="code" aria-hidden="true">404</div>
    <h1>This page fell out of the world</h1>
    <p class="lead">The address you followed doesn't exist or has moved. Check the link, or head back to safe ground.</p>

    <div class="card" role="status" aria-live="polite">
      <div><span class="ok">$</span> locate /requested/page</div>
      <div><span class="err">error</span> no such file or directory</div>
      <div><span class="ok">$</span> recover --home<span class="cursor"></span></div>
    </div>

    <div class="actions">
      <a class="btn primary" href="./">Back to home</a>
      <a class="btn" href="javascript:history.back()">Go back</a>
    </div>
  </main>

  <script>
    // Subtle starfield, generated once.
    (function () {
      var host = document.getElementById('stars');
      for (var i = 0; i < 70; i++) {
        var s = document.createElement('span');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
        s.style.transform = 'scale(' + (0.5 + Math.random()).toFixed(2) + ')';
        host.appendChild(s);
      }
    })();
  </script>
<script id="sift-progress-script">
(function(){
  var bar=document.getElementById('siftProgress'); if(!bar) return;
  var t;
  function start(){ clearTimeout(t); bar.classList.remove('done'); bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('on','run'); }
  function finish(){ bar.classList.add('done'); t=setTimeout(function(){ bar.classList.remove('on','run','done'); },350); }
  window.addEventListener('DOMContentLoaded', finish);
  window.addEventListener('load', finish);
  window.addEventListener('pageshow', function(e){ if(e.persisted) finish(); });
  document.addEventListener('click', function(e){
    var a=e.target.closest && e.target.closest('a[href]'); if(!a) return;
    if(a.target==='_blank'||e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;
    var u; try{ u=new URL(a.href,location.href);}catch(_){return;}
    if(u.origin!==location.origin) return;
    if(u.pathname===location.pathname && u.search===location.search && u.hash) return;
    start();
  }, true);
  window.addEventListener('beforeunload', function(){ start(); });
})();
</script>
</body>
</html>
