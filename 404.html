<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'unsafe-inline'">
<meta name="robots" content="noindex">
<title>صفحه پیدا نشد · SIFT</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
<style>
  @font-face{font-family:'YekanBakh';src:url('assets/fonts/YekanBakh-Light.woff2') format('woff2');font-weight:300;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}@font-face{font-family:'YekanBakh';src:url('assets/fonts/YekanBakh-Regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}@font-face{font-family:'YekanBakh';src:url('assets/fonts/YekanBakh-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}@font-face{font-family:'YekanBakh';src:url('assets/fonts/YekanBakh-Bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
  :root{--bg:#0a0c10;--ink:#eef1f6;--mute:#8d96a8;--line:#1e2330;--accent:#4ea8ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'YekanBakh',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  main{width:min(560px,100%);text-align:center}
  .logo{width:64px;height:64px;border-radius:14px;margin:0 auto 28px;display:block}
  .code{font-size:clamp(72px,16vw,120px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--ink)}
  .code span{color:var(--accent)}
  h1{font-size:22px;font-weight:600;margin:14px 0 10px}
  p{color:var(--mute);line-height:1.9;font-size:15px}
  .actions{margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;font-size:15px;font-weight:600;border:1px solid var(--line);color:var(--ink)}
  a.btn.primary{background:var(--accent);border-color:var(--accent);color:#06101d}
  a.btn:hover{border-color:var(--accent)}
  .path{margin-top:26px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5d6578;direction:ltr;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="sift-smooth">
html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#siftScroll{position:fixed;top:0;left:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#4ea8ff,#3ddc97);box-shadow:0 0 10px rgba(78,168,255,.6);z-index:100000;pointer-events:none}
body.scrolled header,body.scrolled .nav,body.scrolled .topbar{box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/images/sift-logo.png" alt="SIFT" width="64" height="64">
  <div class="code" aria-hidden="true">۴۰۴</div>
  <h1>این صفحه پیدا نشد</h1>
  <p>آدرسی که وارد کردید وجود ندارد یا جابه‌جا شده است. می‌توانید به صفحهٔ اصلی برگردید یا از منو ادامه دهید.</p>
  <div class="actions">
    <a class="btn primary" href="./">بازگشت به صفحهٔ اصلی</a>
    <a class="btn" href="docs/">راهنما</a>
  </div>
  <div class="path" id="path"></div>
</main>
<script>
  document.getElementById('path').textContent = location.pathname;
</script>
<div id="siftScroll" aria-hidden="true"></div>
<script id="sift-smooth-js">
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bar=document.getElementById('siftScroll');
  function onScroll(){
    var h=document.documentElement; var max=h.scrollHeight-h.clientHeight;
    var p=max>0?(h.scrollTop/max):0;
    if(bar) bar.style.transform='scaleX('+p.toFixed(4)+')';
    document.body.classList.toggle('scrolled', h.scrollTop>12);
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  // smooth in-page anchors with fixed-header offset
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    var id=a.getAttribute('href').slice(1); if(!id) return;
    var t=document.getElementById(id); if(!t) return;
    e.preventDefault();
    var y=t.getBoundingClientRect().top+scrollY-(document.querySelector('header')?document.querySelector('header').offsetHeight:0)-16;
    scrollTo({top:y,behavior:reduce?'auto':'smooth'});
    history.pushState(null,'','#'+id);
  });
})();
</script>
</body>
</html>
